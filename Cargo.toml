# Cargo.toml

[package]
name = "ulys"
version = "31.2.0"
edition = "2024"
description = "User-friendly and UUIDv8-compatible ULID tokens with checksum"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ystorian/ulys"
readme = "README.md"
# Forked from https://github.com/dylanhart/ulid-rs
keywords = ["ulid", "uuidv8", "sortable", "checksum"]
publish = true
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "/*.svg", "LICENSE-*"]

[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWQlX4eaj3pSiE/CzvlxHdkTDPVjZy92O+TkoVU011r99ALGHzY4qYNm"

[lib]
name = "ulys"
path = "src/lib.rs"

[[bin]]
name = "ulys"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "uuid"]
postgres = ["dep:bytes", "dep:postgres-types"]
serde = ["dep:serde", "dep:serde_derive", "dep:uuid"]
uuid = ["dep:uuid"]

[dependencies]
base32 = "0.5"
bytes = { version = "1.12", optional = true }
clap = { version = "4.6", optional = true, default-features = false, features = [
	"std",
	"derive",
	"help",
	"usage",
	"error-context",
	"wrap_help",
] }
postgres-types = { version = "0.2", optional = true }
rand = "0.10"
serde = { version = "1.0", optional = true }
serde_derive = { version = "1.0", optional = true }
uuid = { version = "1.23", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh3"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
debug = "none"
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Profile for GitHub actions, used by `.github/workflows/ci-rust.yaml`
[profile.ci]
inherits = "dev"
debug = false
incremental = false
opt-level = 0

[profile.ci.package."*"]
debug = false
incremental = false
opt-level = 0
